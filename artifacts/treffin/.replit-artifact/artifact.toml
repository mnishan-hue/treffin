kind = "web"
previewPath = "/"
title = "Treffin"
description = "A thoughtful social platform where people explore ideas, debate respectfully, and celebrate intellectual curiosity."
version = "1.0.0"
id = "artifacts/treffin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18962

[services.development]
run = "pnpm --filter @workspace/treffin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/treffin", "run", "build" ]
serve = "static"
publicDir = "artifacts/treffin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18962"
BASE_PATH = "/"
